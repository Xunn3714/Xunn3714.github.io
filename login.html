<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lost Mysteries of WPI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-shell">

        <!-- Website Header -->
        <header class="site-header">
            <a class="brand" href="index.html">
                <span class="brand-symbol">✦</span>
                <span>Lost Mysteries <small>of WPI</small></span>
            </a>
            <a class="header-link" href="index.html">← Back to Home</a>
        </header>

        <!-- Main Login Page -->
        <main>
            <section class="login-card">
                <div class="login-header">
                    <p class="eyebrow">WELCOME, EXPLORER</p>
                    <h1>Join the Adventure</h1>
                    <p>Create an account or log in to continue your journey.</p>
                </div>

                <!-- Login and Registration Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username"
                            maxlength="30" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="pin">4-Digit PIN</label>
                        <input type="password" id="pin" name="pin" placeholder="Enter your PIN" inputmode="numeric"
                            pattern="[0-9]{4}" maxlength="4" required>
                    </div>

                    <p id="login-message" role="status"></p>

                    <div class="login-actions">
                        <button type="button" id="login-btn" disabled>Log In</button>
                        <button type="button" id="register-btn" disabled>Create Account</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script>
        // Supabase API configuration
        const SUPABASE_URL = 'https://iqmopypqjrpcxkwfvufh.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RFCOzAUH3LHKFFotX_1MIA_-uZ_pZpx';
        const usernameInput = document.querySelector('#username');
        const pinInput = document.querySelector('#pin');
        const loginBtn = document.querySelector('#login-btn');
        const registerBtn = document.querySelector('#register-btn');
        const loginMessage = document.querySelector('#login-message');

        // Validate username and PIN before enabling buttons
        function validateInputs() {
            const username = usernameInput.value.trim();
            const pin = pinInput.value;

            const validUsername = username.length >= 3 && username.length <= 30;
            const validPin = /^[0-9]{4}$/.test(pin);

            loginBtn.disabled = !(validUsername && validPin);
            registerBtn.disabled = !(validUsername && validPin);
        }

        usernameInput.addEventListener('input', () => {
            loginMessage.textContent = '';
            validateInputs();
        });

        pinInput.addEventListener('input', () => {
            pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
            loginMessage.textContent = '';
            validateInputs();
        });

        // Log in through Supabase Edge Function
        loginBtn.addEventListener('click', async (event) => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const pin = pinInput.value;

            loginBtn.disabled = true;
            loginMessage.textContent = 'Logging in...';

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/login-player`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_PUBLISHABLE_KEY
                    },
                    body: JSON.stringify({ username, pin })
                });

                const data = await response.json();

                if (!response.ok) {
                    loginMessage.textContent = data.error || 'Login failed.';
                    return;
                }

                // Temporarily keep the session in this browser tab
                sessionStorage.setItem('player_session', data.session.token);
                sessionStorage.setItem('player_username', data.player.username);

                window.location.href = 'index.html';

            } catch (error) {
                console.error('Login request failed:', error);
                loginMessage.textContent = 'Unable to connect to the server.';
            } finally {
                validateInputs();
            }
        });

        // Register a new player through Supabase
        registerBtn.addEventListener('click', async (event) => {
            event.preventDefault();

            const username = usernameInput.value.trim();
            const pin = pinInput.value;

            registerBtn.disabled = true;
            loginMessage.textContent = 'Creating account...';

            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/register-player`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_PUBLISHABLE_KEY
                    },
                    body: JSON.stringify({ username, pin })
                });

                const data = await response.json();

                if (!response.ok) {
                    loginMessage.textContent = data.error || 'Registration failed.';
                    return;
                }

                loginMessage.textContent = 'Account created successfully! Please log in.';

            } catch (error) {
                console.error('Registration request failed:', error);
                loginMessage.textContent = 'Unable to connect to the server.';
            } finally {
                validateInputs();
            }
        });

        document.querySelector('#login-form').addEventListener('submit', (event) => {
            event.preventDefault();
        });
    </script>

</body>

</html>
